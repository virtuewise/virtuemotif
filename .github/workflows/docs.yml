name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - ".github/scripts/check_docs_links.py"
      - "requirements-dev.txt"
      - "requirements-ci.txt"
      - "site/index.html"
      - "site/tools.html"
      - "site/tools/**"
      - "tools/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c requirements-ci.txt

      - name: Prepare clean publishing directory
        run: |
          mkdir -p build/site
          cp site/index.html site/tools.html build/site/

      - name: Build public API reference
        run: |
          # Keep this list aligned with the import-safe modules built in CI.
          python -m pdoc -o build/site tools.make_video tools.make_tapsync tools.utils tools.effects tools.benchmark_render

      - name: Check generated documentation links
        run: python .github/scripts/check_docs_links.py build/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: build/site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Smoke-test published documentation
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["SITE_URL"].rstrip("/") + "/"
          expected = {
              # The entry file may be served through a host-level redirect; require HTTP success,
              # then validate the actual landing page and every linked API page below.
              "index.html": (),
              "tools.html": ("tools/make_video.html",),
              "tools/make_video.html": ("make_video",),
              "tools/make_tapsync.html": ("make_tapsync",),
              "tools/utils.html": ("utils",),
              "tools/effects.html": ("effects",),
          }
          last_error = None
          for attempt in range(1, 13):
              try:
                  for path, markers in expected.items():
                      request = Request(base + path, headers={"User-Agent": "VirtueMotif-Pages-SmokeTest/1.0"})
                      with urlopen(request, timeout=10) as response:
                          if response.status != 200:
                              raise HTTPError(base + path, response.status, "unexpected HTTP status", response.headers, None)
                          body = response.read().decode("utf-8", errors="replace")
                          final_url = response.geturl()
                      if markers and not any(marker in body for marker in markers):
                          raise SystemExit(f"{path} (resolved to {final_url}): expected one of {markers!r} in published content")
                  print(f"Published documentation smoke test passed: {base}")
                  break
              except (HTTPError, URLError, TimeoutError) as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed: {exc}")
                  if attempt < 12:
                      time.sleep(10)
          else:
              raise SystemExit(f"Published documentation smoke test failed: {last_error}")
          PY
