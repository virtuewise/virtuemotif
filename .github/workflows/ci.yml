name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint, tests, and docs
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint maintained pipeline and CI tests with Ruff
        run: >-
          ruff check
          tools/make_video.py
          tools/make_tapsync.py
          tools/utils.py
          tools/effects
          tests/test_ci_smoke.py

      - name: Run Python tests
        run: python -m pytest -q

      - name: Check Python syntax
        run: python -m compileall -q tools tests

      - name: Build API documentation
        run: python -m pdoc -o build/api-docs tools.make_video tools.make_tapsync tools.utils tools.effects

      - name: Upload API documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: build/api-docs/
          if-no-files-found: error
          retention-days: 14

  remotion-quality:
    name: Remotion type check and composition validation
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: film
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: film/package-lock.json

      - name: Install Node dependencies
        run: npm ci

      - name: Type-check Remotion project
        run: npx tsc --noEmit

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Validate Remotion compositions
        run: npx remotion compositions src/index.ts
