name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-quality:
    name: Python lint, tests, and docs
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-ci.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -c requirements-ci.txt
          python -m pip check

      - name: Validate JSON manifests have no duplicate keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          def reject_duplicate_keys(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise ValueError(f"duplicate JSON key: {key}")
                  result[key] = value
              return result

          for name in ("package.json", "package-lock.json", "film/package.json", "film/package-lock.json"):
              json.loads(Path(name).read_text(encoding="utf-8"), object_pairs_hook=reject_duplicate_keys)
          PY

      - name: Lint maintained pipeline and CI tests with Ruff
        run: >-
          ruff check
          tools/make_video.py
          tools/audio_intelligence.py
          tools/lyrics_engine.py
          tools/language_timeline.py
          tools/export_lyrics_song.py
          tools/benchmark_render.py
          tools/make_tapsync.py
          tools/utils.py
          tools/export_audio_cues.py
          tools/effects
          tests/test_audio_intelligence.py
          tests/test_lyrics_engine.py
          tests/test_language_timeline.py
          tools/benchmark_language_id.py
          tests/test_benchmark_language_id.py
          tools/validate_language_dataset.py
          tests/test_validate_language_dataset.py
          tests/test_benchmark_governance_gate.py
          tests/test_lyrics_export.py
          tests/test_ci_smoke.py

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate multilingual dataset governance contract
        run: python -m tools.validate_language_dataset

      - name: Run repeatable multilingual language-ID smoke benchmark
        run: python -m tools.benchmark_language_id --output build/benchmark/multilingual-language-id.json

      - name: Upload multilingual language-ID report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multilingual-language-id-smoke
          path: build/benchmark/multilingual-language-id.json
          if-no-files-found: error
          retention-days: 30

      - name: Check Python syntax
        run: python -m compileall -q tools tests

      - name: Run deterministic synthetic render benchmark
        run: python -m tools.benchmark_render --duration-seconds 2 --width 160 --height 90 --fps 15 --output build/benchmark/render-baseline.json

      - name: Upload synthetic render benchmark report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-render-benchmark
          path: build/benchmark/render-baseline.json
          if-no-files-found: error
          retention-days: 14

      - name: Build API documentation
        run: python -m pdoc -o build/api-docs tools.make_video tools.make_tapsync tools.utils tools.effects tools.benchmark_render tools.export_lyrics_song

      - name: Upload API documentation artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-documentation
          path: build/api-docs/
          if-no-files-found: error
          retention-days: 14

  remotion-quality:
    name: Remotion type check and composition validation
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: film
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: film/package-lock.json

      - name: Verify Node.js runtime
        run: |
          node --version
          npm --version
          node -e "if (Number(process.versions.node.split('.')[0]) !== 24) process.exit(1)"

      - name: Install Node dependencies
        run: npm ci

      - name: Set up Python for audio cue export
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Install FFmpeg for compressed audio cue export
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Generate versioned audio cues for Remotion
        run: |
          cd ..
          python -m pip install --upgrade pip
          python -m pip install numpy soundfile
          python -m tools.export_audio_cues

      - name: Test frame-time and audio-cue utilities
        run: node --experimental-strip-types --test ../tests/audio_cues.test.mjs

      - name: Type-check Remotion project
        run: npx tsc --noEmit

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Validate Remotion compositions
        run: npx remotion compositions src/index.ts

      - name: Smoke-render audio-cue-driven Horizon composition
        run: npx remotion still src/index.ts FurryHorizon /tmp/furry-horizon-smoke.png --frame=0

      - name: Smoke-render audio-cue-driven Rise composition
        run: npx remotion still src/index.ts FurryRise /tmp/furry-rise-smoke.png --frame=0
