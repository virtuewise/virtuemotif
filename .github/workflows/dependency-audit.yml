name: Dependency security audit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "41 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-audit:
    name: Python dependency vulnerability audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit==2.9.0"
      - name: Audit Python dependency declarations
        run: |
          pip-audit -r requirements-dev.txt -r requirements-ci.txt --strict

  npm-audit:
    name: npm dependency vulnerability audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v6
        with:
          node-version: "22"
      - name: Audit root npm dependencies
        run: npm audit --package-lock-only --audit-level=high
      - name: Audit Remotion film dependencies
        working-directory: film
        run: npm audit --package-lock-only --audit-level=high
